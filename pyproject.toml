[project]
name = "reservations"
version = "1.0.0"
description = "Table reservations for the restaurant site: hexagonal core, SQLite and FastAPI adapters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
reservations = "reservations.adapters.inbound.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reservations"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["www"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
